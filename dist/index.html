<!DOCTYPE html>
<html class="palette-catppuccin" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <link href="assets/favicon.svg" rel="shortcut icon" type="image/x-icon" />

    <link rel="preload" href="fonts/roboto-v30-latin-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/roboto-mono-v23-latin-regular.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="./bundle.css" />
    <script src="./bundle.min.js"></script>
  </head>

<body >
    <div class="settings container-card">
      <div>
        <h3 id="global-settings-title">Global Settings</h3>
        <div class="individual-setting">
          <label class="setting-checkbox">
            <input type="checkbox" id="toggle-search-checkbox" />
            Show Search
          </label>

          <label class="setting-checkbox">
            <input type="checkbox" id="toggle-blank-checkbox" />
            Open in New Tab
          </label>
        </div>
      </div>
      <div>
        <h3 id="bookmarks-title">Bookmarks</h3>
        <button id="add-bookmark">Add Bookmark Set</button>
        <div id="bookmarks-container" class="settings-category-container"></div>
      </div>
      <div>
        <h3 id="search-prefixes-title">Search Prefixes</h3>
        <div
          id="search-prefixes-container"
          class="settings-category-container"
        ></div>
      </div>
      <div>
        <h3 id="wallpaper-title">Background</h3>
        <div id="wallpaper-container" class="settings-category-container"></div>
      </div>

    </div>
    <div class="coin-flip">
      <img
        loading="lazy"
        src="assets/wallpapers/room-night.jpg"
        class="side-a"
      />
      <img loading="lazy" src="assets/wallpapers/room-day.jpg" class="side-b" />
    </div>

    <div class="time-stuff-container"></div>

    <div class="container">
      <div id="top-row">
        <div id="clock" data-day="" data-month:="" class="container-card"></div>
        <input
          id="searchInput"
          placeholder="open bookmark..."
          class="message-container"
        />
      </div>
      <div id="bookmark-container"></div>
    </div>
  </body>
</html>
